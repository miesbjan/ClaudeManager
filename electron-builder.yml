appId: cz.projectconsole.mdviewer
productName: Markdown Viewer
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  fileAssociations:
    - ext: md
      name: Markdown
      role: Viewer
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Markdown Viewer
portable:
  artifactName: MarkdownViewer-portable-${version}.exe
