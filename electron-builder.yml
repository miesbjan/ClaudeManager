appId: cz.claudemanager.app
productName: Claude Manager
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # The tray needs a picture at runtime; the .ico on the exe is not one it can read.
  - build/icon.png
  # Debug symbols shipped with node-pty are 11 MB of nothing useful here.
  - "!**/*.pdb"
  - "!**/node_modules/node-pty/prebuilds/{darwin,linux}-*/**"
asar: true
# node-pty ships N-API prebuilt binaries that already load in Electron, so the
# automatic @electron/rebuild pass is pure cost - and it fails without a compiler.
npmRebuild: false
# The PTY binary has to be a real file on disk; it cannot be loaded from the archive.
asarUnpack:
  - "**/node_modules/node-pty/**"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  fileAssociations:
    - ext: md
      name: Markdown
      role: Viewer
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Claude Manager
portable:
  artifactName: ClaudeManager-portable-${version}.exe
