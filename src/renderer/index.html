<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: mdasset:; frame-src http://localhost:* http://127.0.0.1:*; font-src 'self' data:; connect-src 'self' ws:; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Project Console</title>
  </head>
  <body>
    <header id="toolbar">
      <div class="toolbar-group toolbar-first" role="group" aria-label="Open">
        <button id="new-tab-btn" class="toolbar-btn" type="button" title="New tab (Ctrl+T)">
          + New tab
        </button>
        <button id="folder-btn" class="toolbar-btn" type="button" title="Open a folder">
          Open folder
        </button>
        <button id="open-btn" class="toolbar-btn" type="button" title="Open a file (Ctrl+O)">
          Open file
        </button>
      </div>

      <div class="toolbar-group" role="group" aria-label="Panes">
        <button id="shell-btn" class="toolbar-btn" type="button" title="Shell pane (Ctrl+`)">
          Shell
        </button>
        <button
          id="web-btn"
          class="toolbar-btn"
          type="button"
          title="Document or dev server (Alt+W)"
          hidden
        >
          Web
        </button>
      </div>

      <div class="toolbar-group toolbar-end" role="group" aria-label="Application">
        <button id="lang-btn" class="toolbar-btn" type="button" title="Interface language">
          CS
        </button>
        <button id="theme-btn" class="toolbar-btn" type="button" title="Switch theme (Ctrl+D)">
          Theme: Auto
        </button>
        <button id="help-btn" class="toolbar-btn" type="button" title="Keyboard shortcuts">
          ?
        </button>
      </div>
    </header>

    <nav id="tabbar"></nav>

    <main id="panes">
      <section id="terminal-pane" hidden>
        <div id="shell-bar">
          <button id="run-btn" class="run-btn" type="button" hidden>▶ Run</button>
          <button id="catchup-btn" class="run-btn" type="button" hidden>Catch me up</button>
          <span id="shell-project"></span>
        </div>
        <div id="term-hosts"></div>
        <section id="prompt-pane" hidden>
          <textarea
            id="prompt-input"
            spellcheck="false"
            placeholder="Compose a prompt here. Ctrl+Enter sends it to the shell."
          ></textarea>
          <div id="prompt-bar">
            <span id="prompt-hint">Ctrl+Enter sends · Esc back to the shell</span>
            <button id="prompt-send" class="run-btn" type="button">Send ⏎</button>
          </div>
        </section>
      </section>
      <div id="splitter" hidden></div>
      <div id="right-area">
        <section id="viewer" tabindex="-1">
          <article id="content" class="markdown-body" hidden></article>
          <textarea id="raw" hidden spellcheck="false" wrap="off"></textarea>
          <div id="empty">
            <p><strong>No document open.</strong></p>
            <p id="empty-body"></p>
            <p id="empty-intro" class="muted"></p>
          </div>
        </section>
        <section id="web-pane" hidden tabindex="-1">
          <div id="web-bar">
            <input id="web-url" type="text" spellcheck="false" placeholder="localhost:3000" />
            <button id="web-reload" class="find-btn" type="button" title="Reload">↻</button>
          </div>
          <!--
            A webview rather than an iframe, and with a partition of its own, because
            those two things are what buy the page a process of its own: Chromium never
            shares a renderer across storage partitions. As a frame it was same-site
            with the app - localhost either way - so it shared this window's process,
            and a dev server that ran out of memory took the whole console down with
            it, terminals and running agents included.
          -->
          <webview id="web-frame" title="Local preview" partition="persist:preview"></webview>
        </section>
      </div>

      <div id="find" hidden>
        <input id="find-input" type="text" placeholder="Find in document" spellcheck="false" />
        <span id="find-count">0/0</span>
        <button id="find-prev" class="find-btn" type="button" title="Previous (Shift+Enter)">↑</button>
        <button id="find-next" class="find-btn" type="button" title="Next (Enter)">↓</button>
        <button id="find-close" class="find-btn" type="button" title="Close (Esc)">×</button>
      </div>
    </main>

    <footer id="statusbar">
      <span id="status-text">No file open</span>
      <div id="status-right">
        <span id="usage" hidden></span>
        <span id="limits" hidden></span>
      </div>
    </footer>

    <div id="ctxmenu" hidden></div>

    <aside id="help" hidden tabindex="-1"></aside>

    <div id="place" hidden>
      <input id="place-input" type="text" spellcheck="false" placeholder="~/source/project" />
      <ul id="place-list"></ul>
      <p id="place-note"></p>
    </div>

    <div id="modal" hidden></div>

    <div id="palette" hidden>
      <input id="palette-input" type="text" spellcheck="false" placeholder="Go to file" />
      <ul id="palette-list"></ul>
      <p id="palette-note"></p>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
