<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: mdasset:; frame-src http://localhost:* http://127.0.0.1:*; font-src 'self' data:; connect-src 'self' ws:; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Markdown Viewer</title>
  </head>
  <body>
    <header id="toolbar">
      <button id="open-btn" class="toolbar-btn" type="button">+ Open Markdown</button>
      <button id="shell-btn" class="toolbar-btn" type="button" title="Toggle shell pane (Ctrl+`)">
        Shell
      </button>
      <button id="web-btn" class="toolbar-btn" type="button" title="Show the dev server (Alt+W)" hidden>
        Web
      </button>
      <button id="theme-btn" class="toolbar-btn" type="button" title="Switch theme (Ctrl+D)">
        Theme: Auto
      </button>
      <button id="help-btn" class="toolbar-btn" type="button" title="Keyboard shortcuts">
        ?
      </button>
      <span id="hint">Ctrl+O open · Ctrl+Tab next tab · Ctrl+` shell · Alt+←→ panes · Alt+Z zoom</span>
    </header>

    <nav id="tabbar"></nav>

    <main id="panes">
      <section id="terminal-pane" hidden>
        <div id="shell-bar">
          <button id="run-btn" class="run-btn" type="button" hidden>▶ Run</button>
          <span id="shell-project"></span>
        </div>
        <div id="term-hosts"></div>
      </section>
      <div id="splitter" hidden></div>
      <section id="web-pane" hidden>
        <div id="web-bar">
          <input id="web-url" type="text" spellcheck="false" placeholder="localhost:3000" />
          <button id="web-reload" class="find-btn" type="button" title="Reload">↻</button>
        </div>
        <iframe
          id="web-frame"
          title="Local preview"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
        ></iframe>
      </section>

      <section id="viewer" tabindex="-1">
        <article id="content" class="markdown-body" hidden></article>
        <div id="empty">
          <p><strong>No document open.</strong></p>
          <p>Press <kbd>Ctrl</kbd>+<kbd>O</kbd>, use <em>+ Open Markdown</em>, or drop a <code>.md</code> file into this window.</p>
        </div>
      </section>
      <div id="find" hidden>
        <input id="find-input" type="text" placeholder="Find in document" spellcheck="false" />
        <span id="find-count">0/0</span>
        <button id="find-prev" class="find-btn" type="button" title="Previous (Shift+Enter)">↑</button>
        <button id="find-next" class="find-btn" type="button" title="Next (Enter)">↓</button>
        <button id="find-close" class="find-btn" type="button" title="Close (Esc)">×</button>
      </div>
    </main>

    <footer id="statusbar">No file open</footer>

    <div id="ctxmenu" hidden></div>

    <aside id="help" hidden tabindex="-1"></aside>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
